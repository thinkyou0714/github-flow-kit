name: Skill Validation

on:
  pull_request:
    paths:
      - '**/SKILL.md'
      - '**/references/**'
      - 'tests/**'
      - '.github/secret-patterns.txt'
      - '.github/workflows/skill-validate.yml'
  push:
    branches: [main]
    paths:
      - '**/SKILL.md'
      - '**/references/**'
      - 'tests/**'
      - '.github/secret-patterns.txt'
      - '.github/workflows/skill-validate.yml'

# Validation only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: skill-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # PyYAML is NOT guaranteed to be preinstalled on the runner image, so set
      # up Python explicitly and install the dependency to keep validation green.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<'EOF'
          import yaml, sys, pathlib

          REQUIRED_FIELDS = ['name', 'description', 'allowed-tools']
          VALID_MODELS = [
              'claude-opus-4-8',
              'claude-sonnet-4-6',
              'claude-opus-4-7',
              'claude-haiku-4-5-20251001',
          ]

          errors = []
          skill_files = list(pathlib.Path('.').rglob('SKILL.md'))
          for skill_md in skill_files:
              content = skill_md.read_text(encoding='utf-8')
              if not content.startswith('---'):
                  errors.append(f"{skill_md}: Missing frontmatter")
                  continue
              # maxsplit=2 so a '---' horizontal rule in the body can't corrupt
              # the frontmatter slice (parts[1]).
              parts = content.split('---', 2)
              if len(parts) < 3:
                  errors.append(f"{skill_md}: Malformed frontmatter (no closing ---)")
                  continue
              try:
                  fm = yaml.safe_load(parts[1])
              except yaml.YAMLError as e:
                  errors.append(f"{skill_md}: YAML parse error: {e}")
                  continue
              if not isinstance(fm, dict):
                  errors.append(f"{skill_md}: Frontmatter is not a mapping")
                  continue
              for field in REQUIRED_FIELDS:
                  if field not in fm:
                      errors.append(f"{skill_md}: Missing required field '{field}'")
              if 'model' in fm and fm['model'] not in VALID_MODELS:
                  errors.append(f"{skill_md}: Invalid model '{fm['model']}'")
              desc = fm.get('description', '')
              if isinstance(desc, str) and len(desc) > 1536:
                  errors.append(f"{skill_md}: description exceeds 1536 chars ({len(desc)})")

          if errors:
              print("SKILL.md validation FAILED:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print(f"All SKILL.md files valid ({len(skill_files)} files checked).")
          EOF

      - name: Check for secrets in SKILL.md and references/
        run: |
          echo "Scanning for potential secrets..."
          # Patterns live in .github/secret-patterns.txt so the scanner and the
          # regression test (tests/test_secret_scan.py) share one source of truth.
          if grep -rEnf .github/secret-patterns.txt \
            ./*/SKILL.md ./*/references/ 2>/dev/null; then
            echo "ERROR: Potential secret found in skill files"
            exit 1
          fi
          echo "No secrets detected."

      - name: Check references exist
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys

          errors = []
          for skill_md in pathlib.Path('.').rglob('SKILL.md'):
              content = skill_md.read_text(encoding='utf-8')
              refs = re.findall(r'references/(\S+\.md)', content)
              skill_dir = skill_md.parent
              for ref in refs:
                  ref_path = skill_dir / 'references' / ref
                  if not ref_path.exists():
                      errors.append(f"{skill_md} references '{ref}' but {ref_path} does not exist")

          if errors:
              print("Missing references:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print("All references exist.")
          EOF

      - name: Run skill logic tests
        run: |
          # Auto-discovers every tests/test_*.py (scoring, secret-scan, inventory),
          # so new test files run in CI without editing this workflow.
          python3 -m unittest discover -s tests -p 'test_*.py' -v
