name: Skill Release Announce

on:
  release:
    types: [published]

# Least privilege: this workflow only reads release metadata.
permissions:
  contents: read

concurrency:
  group: announce-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    continue-on-error: true
    # Secrets cannot be referenced in `if:` conditions, so expose the webhook
    # as a job-level env var and gate the step on `env` instead.
    # https://docs.github.com/actions/security-guides/using-secrets-in-github-actions
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Post to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          # Pass untrusted release fields through env to avoid script injection.
          TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          PAYLOAD=$(python3 -c '
          import json, os
          tag = os.environ.get("TAG", "")
          name = os.environ.get("RELEASE_NAME", "") or tag
          url = os.environ.get("RELEASE_URL", "")
          body = (os.environ.get("RELEASE_BODY", "") or "")[:300]
          text = (
              f":rocket: *github-flow-kit {tag} released!*\n"
              f">{name}\n\n{body}\n\n"
              f"<{url}|View Release> | `gh skill update --all` to upgrade"
          )
          print(json.dumps({"text": text}))
          ')

          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          echo "Release ${TAG} announced"
          echo "Tag: ${TAG}"
          echo "URL: ${RELEASE_URL}"
